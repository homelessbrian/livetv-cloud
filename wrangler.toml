name = "livetv-cloud"
main = "src/index.js"
compatibility_date = "2025-06-01"

# The database. Cloudflare creates it on the first deploy if it does not exist yet.
# If a deploy ever asks for an ID, create a D1 database in the dashboard and add
#   database_id = "<its ID>"
# as a new line under this block.
[[d1_databases]]
binding = "DB"
database_name = "livetv-sync"
